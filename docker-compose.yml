services:
  backend:
    networks:
      - routine-net
    environment:
      - TZ=Europe/Athens
      - MCP_API_KEY=my-secret-key-123

  frontend:
    depends_on:
      - backend
    networks:
      - routine-net

  # LLM Service for exercise generation and RAG
  llm-service:
    networks:
      - routine-net
    environment:
      - TZ=Europe/Athens
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-openai}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gpt-4o-mini}

  # Tunnel (ngrok) for public MCP endpoint access
  # The public URL (HTTP & HTTPS) will be printed to logs
  tunnel:
    image: ngrok/ngrok:latest
    command: http --url=${NGROK_DOMAIN} backend:3000
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - backend
    networks:
      - routine-net
    restart: unless-stopped
    profiles:
      - mcp  # Only starts with: docker compose --profile mcp up

networks:
  routine-net:

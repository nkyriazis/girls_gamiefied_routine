services:
  backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "if [ ! -d node_modules ]; then npm install; fi && npm run dev"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - TZ=Europe/Athens
    networks:
      - routine-net

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - routine-net

networks:
  routine-net:

services:
  backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./shared:/shared
    command: sh -c "if [ ! -d node_modules ]; then npm install; fi && npm run dev"
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - ./shared:/shared
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    environment:
      - CHOKIDAR_USEPOLLING=true

  llm-service:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./llm-service:/app
      - ./llm-service/data:/app/data
    ports:
      - "8000:8000"
    command: sh -c "pip install -q -r requirements.txt && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - PYTHONUNBUFFERED=1

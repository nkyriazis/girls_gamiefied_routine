server {
    listen 80;

    # Compression (#100): nginx:alpine leaves gzip off, so the Pi sent every script and style raw.
    # gzip_static serves the .gz the image's builder wrote beside each script and style in assets/
    # (gzip -9, frontend/Dockerfile), so the big chunks cost the Pi no CPU; gzip compresses the rest
    # (/api JSON, index.html, svg) on the fly at level 5. Media (mp3, wav, png, ico, uploads) is already
    # compressed and stays out of gzip_types, keeping its byte ranges. src/nginxGzip.test.ts holds this.
    gzip on;
    gzip_static on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml application/manifest+json;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # The parents' upload (an alarm song, an icon): one file up to UPLOAD_MAX_BYTES (shared/uploads.ts, 10 MB),
    # plus room for the multipart headers. Only here: every other request keeps nginx's default 1m.
    # src/uploadLimit.test.ts checks it against the backend's limit; change both together.
    location = /api/admin/upload {
        client_max_body_size 11m;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_set_header Host $host;
    }

    location /ws {
        gzip off;  # the WebSocket has its own permessage-deflate
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
# Production deployment using pre-built images from GitHub Container Registry
services:
  backend:
    image: ghcr.io/nkyriazis/routine-backend:latest
    volumes:
      - ./backend:/data
      - ./backend/uploads:/app/uploads
    environment:
      - DATA_FILE=/data/data.json
      - DB_FILE=/data/routine.db
      # Legacy files, imported into the database once on first start (read-only)
      - STATE_FILE=/data/state.json
      - LOGS_FILE=/data/logs.jsonl
    restart: always

  frontend:
    image: ghcr.io/nkyriazis/routine-frontend:latest
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: always

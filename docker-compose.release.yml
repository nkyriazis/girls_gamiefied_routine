# Production deployment using pre-built images from GitHub Container Registry
services:
  backend:
    image: ghcr.io/nkyriazis/routine-backend:latest
    volumes:
      - ./backend:/data
      - ./backend/uploads:/app/uploads
    environment:
      - DATA_FILE=/data/data.json
      - STATE_FILE=/data/state.json
    restart: always

  frontend:
    image: ghcr.io/nkyriazis/routine-frontend:latest
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: always

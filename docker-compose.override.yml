services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./backend:/data
      - ./backend/uploads:/app/uploads
    environment:
      - DATA_FILE=/data/data.json
      - STATE_FILE=/data/state.json
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: always
